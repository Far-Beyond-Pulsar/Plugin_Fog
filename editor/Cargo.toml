[package]
name = "fog_editor"
version = "0.1.0"
edition = "2024"
description = "Fog (pulsar.fog): the editor crate -- the environment mixer's global fog and local fog volume entries, over the plugin's component crate"

[lib]
name = "fog_editor"

[dependencies]
fog_component = { workspace = true }
# The level editor UI the root registers through its extension points
# (`ui_level_editor::extend`).
ui_level_editor = { workspace = true }

[lints]
workspace = true
