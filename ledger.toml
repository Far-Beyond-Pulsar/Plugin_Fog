# ── GPU buffer keys ─────────────────────────────────────────────

[[buffer]]
key = "global_fog_media"
producers = ["GlobalFogComponent"]
consumers = ["helio-pass-volumetric-fog"]
owner = "helio-scene-derivations environment join (execution output, one row per component instance)"
disposition = "keep: helio-pass-volumetric-fog and helio-pass-postprocess (fog composite) read it through key-string helpers the source scan does not list as consumers; the join gates on owner, generation and visibility"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/fog/tests/scene_rows.rs; plugins/installed/tests/render_acceptance.rs (environment_components_reach_the_frame)"
status = "verified"

[[buffer]]
key = "local_fog_media"
producers = ["LocalFogVolumeComponent"]
consumers = ["helio-pass-volumetric-fog"]
owner = "helio-scene-derivations environment join (execution output, one row per component instance)"
disposition = "keep: helio-pass-volumetric-fog and helio-pass-postprocess (fog composite) read it through key-string helpers the source scan does not list as consumers; the join places the box from the owner's transform"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/fog/tests/scene_rows.rs; plugins/installed/tests/render_acceptance.rs (environment_components_reach_the_frame)"
status = "verified"

[[buffer]]
key = "global_fog_sources"
producers = ["GlobalFogSourceRow"]
consumers = []
owner = "helio_component::components::environment_rows"
disposition = "keep: GlobalFogComponent in its owner's space, derived on every write; the environment join reads it into global_fog_media"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/fog/tests/scene_rows.rs"
status = "verified"

[[buffer]]
key = "local_fog_sources"
producers = ["LocalFogSourceRow"]
consumers = []
owner = "helio_component::components::environment_rows"
disposition = "keep: LocalFogVolumeComponent in its owner's space, derived on every write; the environment join reads it into local_fog_media"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/fog/tests/scene_rows.rs"
status = "verified"

# ── Render pass crates ──────────────────────────────────────────

[[pass]]
crate = "helio-pass-volumetric-fog"
in_default_graph = false
reads = ["global_fog_media", "local_fog_media"]
owner = "helio-presets (mapping); helio-pass-volumetric-fog (algorithm)"
disposition = "keep: reads the fog's media rows, derived from authored components (Phase 4); no post-process input since fog left post (p17)"
target_contract = "Phase 6; 03-gpu-reflection-and-rendering.md"
test = "plugins/installed/tests/render_acceptance.rs (environment_components_reach_the_frame); plugins/vendor/fog/tests/scene_rows.rs; plugins/installed/tests/render_acceptance.rs (every_pass_of_the_editor_graph_runs)"
status = "verified"

[[buffer]]
key = "volumetric_fog_settings"
producers = ["VolumetricFogSettingsComponent"]
consumers = []
owner = "volumetric-fog pass type; writer not identified"
disposition = "outside the engine (Phase 4): no authored source; the pass uses its defaults"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "none: consumer not identified"
status = "out-of-scope"
