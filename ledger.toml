buffers = ["global_fog_sources"]
clears_on_remove = true
releases_var_len = false
registered = true
writer = "GlobalFogComponent's derived GPU registration (the pass GlobalFogComponent medium, enabled from the authored flag), on every insert, write, removal and replay"
owner = "fog_component"
disposition = "keep: the environment join's global_fog_media input (Phase 4)"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
