buffers = ["local_fog_sources"]
clears_on_remove = true
releases_var_len = false
registered = true
writer = "LocalFogVolumeComponent's derived GPU registration (the local box size, then the medium and edge fade; placed from the owner's transform by the join), on every insert, write, removal and replay"
owner = "fog_component"
disposition = "keep: the environment join's local_fog_media input (Phase 4)"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
