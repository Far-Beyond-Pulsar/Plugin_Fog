# The fog plugin's rows of the SceneDB closure ledger (Pulsar-Native#1035):
# its classes, GPU schemas, buffers, pass crates and call sites. A plugin owns
# the rows of what it ships (Pulsar-Native#1606); `cargo test -p scene_inventory`
# in a Pulsar-Native checkout recomputes every fact column, checks the human
# columns, and fails on a missing, stale or misplaced row. The columns are
# described in Pulsar-Native's crates/core/scene_inventory/ledger.toml.

# ── Exposed component classes ───────────────────────────────────

[[class]]
name = "GlobalFogComponent"
category = "Rendering"
world_registered = true
own_gpu_columns = true
owner = "fog_component::component"
disposition = "render, Phase 4. Its derived source row is written on every insert, write, removal and replay; the environment join gates and places it into global_fog_media, which volumetric fog reads. The behavior no longer queues rows"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/fog/tests/scene_rows.rs; plugins/installed/tests/render_acceptance.rs (environment_components_reach_the_frame)"
status = "verified"

[[class]]
name = "LocalFogVolumeComponent"
category = "Rendering"
world_registered = true
own_gpu_columns = true
owner = "fog_component::component"
disposition = "render, Phase 4. Its derived source row is written on every insert, write, removal and replay; the environment join gates and places it into local_fog_media, which volumetric fog reads. The behavior no longer queues rows"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/fog/tests/scene_rows.rs; plugins/installed/tests/render_acceptance.rs (environment_components_reach_the_frame)"
status = "verified"

# ── GPU-bearing schemas ─────────────────────────────────────────

[[schema]]
type = "GlobalFogComponentGpuMirror"
path = "fog_component::component::GlobalFogComponentGpuMirror"
buffers = []
clears_on_remove = true
releases_var_len = false
registered = false
writer = "none: the generated companion uploads a GPU row only for an #[engine_class(gpu_rows)] class (Phase 4); no engine class opts in"
owner = "fog_component::component"
disposition = "keep as a CPU mapping type (LightComponent's derived LightSourceRow is built from its mirror); nothing is uploaded"
target_contract = "Phase 1; 03-gpu-reflection-and-rendering.md"
test = "crates/core/engine_class_derive/tests/gpu_mirror_derive.rs (without_gpu_rows_the_companion_uploads_nothing)"
status = "verified"

[[schema]]
type = "LocalFogVolumeComponentGpuMirror"
path = "fog_component::component::LocalFogVolumeComponentGpuMirror"
buffers = []
clears_on_remove = true
releases_var_len = false
registered = false
writer = "none: the generated companion uploads a GPU row only for an #[engine_class(gpu_rows)] class (Phase 4); no engine class opts in"
owner = "fog_component::component"
disposition = "keep as a CPU mapping type (LightComponent's derived LightSourceRow is built from its mirror); nothing is uploaded"
target_contract = "Phase 1; 03-gpu-reflection-and-rendering.md"
test = "crates/core/engine_class_derive/tests/gpu_mirror_derive.rs (without_gpu_rows_the_companion_uploads_nothing)"
status = "verified"

[[schema]]
type = "GlobalFogComponent"
path = "fog_component::component::GlobalFogComponent"
buffers = ["global_fog_media"]
clears_on_remove = true
releases_var_len = false
registered = false
writer = "the authored value's SceneDB GPU dispatch is its derived GlobalFogSourceRow (environment_rows), on every insert, write, removal and replay; the generated companion uploads nothing (Phase 4)"
owner = "fog_component::component"
disposition = "keep: the authored type's GPU row is GlobalFogSourceRow, the environment join's input"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/fog/tests/scene_rows.rs"
status = "verified"

