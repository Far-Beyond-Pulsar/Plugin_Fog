# The `pulsar.fog` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its kind is absent (see
# crates/core/pulsar_plugins). Its root crate carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.fog"
name = "Fog"
description = "Global and local fog media: their components, rows and the renderer feature that integrates and composites them (volumetric fog)"
enabled_by_default = true
provides = [
  { id = "pulsar.fog.rows", kind = "buffer", members = ["global_fog_media", "local_fog_media", "volumetric_fog_settings"] },
]
# Optional: without the lights the volumetric pass runs on the frame's stand-in.
requires = [
  { id = "pulsar.lights.rows", optional = true },
  { id = "pulsar.lights.api", optional = true },
]

# The plugin's root crate (the package in this directory): the one place it
# registers everything it contributes. A game links it without its `editor`
# feature; the editor links it with.
root = "fog_plugin"
